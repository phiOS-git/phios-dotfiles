<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- phiOS -- Role B (agent presence), Tier 1. Colour is PHI_ACCENT, dark
       variant (#d3a0ac) -- literal, not a token: see design/brand/README.md.
       Static reference only: phi-shell's own Bar/modules/PhiAgent.qml
