# phiOS — BF-3 (Out-of-plan: bugfixing). Make NetworkManager hand its DNS to
# resolvconf (openresolv) instead of writing /etc/resolv.conf itself, so
# openresolv is the single owner of that file.
#
# Without this, on razer: `phi vpn up` / `wg-quick up` calls `resolvconf -a`
# to install the tunnel's DNS, but NetworkManager races it writing
# /etc/resolv.conf back — the manual `sudo resolvconf -u` the user had to
# run. And `wg-quick down`'s `resolvconf -d` then leaves openresolv with no
# nameservers registered at all → an empty /etc/resolv.conf and no name
# resolution until the VPN is brought back up ("lose access to internet").
# With NM feeding resolvconf, openresolv always holds the LAN DNS too, so
# up composes correctly and down falls back cleanly.
#
# openresolv is already installed on razer (it owns /usr/bin/resolvconf);
# this is the missing coordination, not a missing package.
#
# NEVER APPLIED BY THE INSTALLER. /etc material shown by
# `phios-install --system-diff`; applying it is a user action:
#   sudo install -Dm644 profiles/laptop/system/etc/NetworkManager/conf.d/rc-manager.conf \
#     /etc/NetworkManager/conf.d/rc-manager.conf
#   sudo systemctl reload NetworkManager.service
# then re-test `phi vpn up <tunnel>` / `phi vpn down <tunnel>` — no manual
# `resolvconf -u` should be needed, and internet must keep working after down.

[main]
rc-manager=resolvconf
