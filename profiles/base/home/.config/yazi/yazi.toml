[mgr]
show_hidden = false

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# Image opening: yazi's bundled default opener for image/* is `xdg-open %s1`
# (yazi-config/preset/yazi-default.toml). Naming a real target here ensures
# proper integration. Uses the same phi-shell image surface
# (Images/ImageWindow.qml, `qs ipc call image open <path>`) that the launcher
# FilesProvider now also uses, so yazi and launcher open images identically.
[opener]
phios-image = [
{ run = 'qs -p ~/.config/quickshell/phi ipc call image open %s1', desc = "Open in phi-shell", for = "linux", orphan = true },
]

[open]
prepend_rules = [
{ mime = "image/*", use = "phios-image" },
]
