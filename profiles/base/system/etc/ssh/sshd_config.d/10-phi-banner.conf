# phiOS -- SSH banner (S-53, master plan Sec6.6/Sec9.1, Role A). A drop-in,
# not an edit to sshd_config itself: this repository has never tracked
# sshd_config before this step, and a drop-in is additive -- it cannot
# conflict with whatever the real machine's own sshd_config already has,
# unlike a hand-merged edit to a file this repo does not otherwise own.
# OpenSSH reads /etc/ssh/sshd_config.d/*.conf automatically via its own
# default `Include` line -- confirm this on the real machine before relying
# on it (a pre-existing sshd_config from an older OpenSSH version, or one
# with its own Include line removed, would silently not pick this up; the
# banner failing to show is the only symptom, nothing else is affected).
#
# Uses the Unicode Φ (design/brand/phi-ascii.txt's ASCII fallback is for
# the raw TTY console specifically, where the kernel console font's script
# coverage is unverified -- an SSH client is a real terminal emulator with
# this project's own font stack, S-51, so the literal glyph is safe here).
Banner /etc/phi-banner
