#!/usr/bin/nft -f
# phiOS — managed by `phi firewall`. Manual edits are lost on the next
# `phi firewall` command. This file scopes every change to `table inet
# phi`, so a container/VM runtime's own nftables tables are left alone.
# See `phi firewall status`.

# firewall disabled — the phi table is removed, every packet is accepted.
add table inet phi
delete table inet phi
