# phiOS — kitty base config. Theme, fonts and cursor-trail are split into
# their own included files (two of them design/adapters.txt templates); this
# file holds only keyboard and mouse bindings.
#
# `clear_all_shortcuts` drops kitty's whole default keymap — phiOS keeps the
# terminal quiet and lets the compositor own almost every chord. The few
# kept here are the clipboard ones the user asked for.

clear_all_shortcuts yes

# Copy / paste. Super+C copies the current selection to the clipboard (a
# no-op when nothing is selected — kitty never wipes the clipboard here);
# Super+V pastes. Super+C only reaches kitty because hyprland.lua no longer
# binds it (centre-window moved to Super+Shift+C).
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Right-click copies the selection straight to the clipboard (`ungrabbed`
# only, so a full-screen mouse-driven TUI still gets its own right-click).
# This replaces kitty's default right-click "extend selection".
mouse_map right press ungrabbed copy_to_clipboard

# docs/TODO.md (2026-09-14): "the mouse cursor disappears after few seconds
# idle on the terminal". kitty's own default for mouse_hide_wait is 3.0
# seconds on Linux (kitty docs, sw.kovidgoyal.net/kitty/conf/: "Hide mouse
# cursor after the specified number of seconds... Set to zero to disable
# mouse cursor hiding") — nothing in this file ever overrode it, so that
# stock 3-second auto-hide was in effect the whole time. Set to 0 to
# disable it outright rather than just lengthening the wait.
mouse_hide_wait 0

include theme.conf
include fonts.conf
include motion.conf
include padding.conf
