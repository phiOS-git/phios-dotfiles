# phiOS — kitty cursor trail (S-52, master plan §6.5 Category A: "feedback
# di tracciamento... cursor_trail kitty" — §6.5's own named example for this
# exact category).
#
# A plain home/ file, not a design/adapters.txt template: it has no design
# token to substitute (see below), so there is nothing here for `phi theme
# set` to ever regenerate.
#
# NOT derived from a design/tokens.*.sh motion value, and that is a
# deliberate, documented exception, not an oversight: kitty's cursor_trail
# is measured in milliseconds of STILLNESS before a trail engages (a
# debounce), and cursor_trail_decay in seconds of FADE RANGE (fastest and
# slowest, real kitty docs, sw.kovidgoyal.net/kitty/conf/, fetched and
# quoted this session) — neither is "how long does an animation run", the
# thing every PHI_MOTION_* token actually measures. Forcing PHI_MOTION_A_
# PERIOD (1600ms, a loop period) through either of these unrelated units
# would be a coincidence, not a derivation. These two values are therefore
# a plain, once-off tuning choice — light and fast, matching category A's
# own "leggero" — not a governed token, the same way the symbol_map
# codepoint ranges in fonts.conf.tmpl are protocol constants rather than
# design values. Freely adjustable to taste; nothing else in this
# repository reads these two numbers.
cursor_trail 20
cursor_trail_decay 0.1 0.2
