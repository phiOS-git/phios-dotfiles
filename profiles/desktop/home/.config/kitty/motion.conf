# phiOS kitty cursor trail.
#
# A plain home/ file, not a design/adapters.txt template. NOT derived from
# design/tokens.*.sh motion values (a deliberate exception): kitty's
# cursor_trail is milliseconds of STILLNESS before a trail engages (debounce),
# and cursor_trail_decay is seconds of FADE RANGE — neither is "how long does
# an animation run" (what PHI_MOTION tokens measure). These are once-off
# tuning choices (light and fast) freely adjustable to taste; nothing else in
# the repository reads them.
cursor_trail 20
cursor_trail_decay 0.1 0.2
