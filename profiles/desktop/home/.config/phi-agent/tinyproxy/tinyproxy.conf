# phiOS — A2 egress whitelist (docs/phios-agente.md §5.1).
#
# tinyproxy is the ONLY thing A2 can reach that is not the broker, and it
# forwards only to hosts matched by whitelist (this directory). It runs as
# a user service (phi-agent-proxy.service), reachable from A2 only through
# the socat unix bridge — never bound to a routable interface.
#
# __HOME__ and __RUNTIME__ are substituted by the unit's ExecStartPre into
# a rendered copy under $XDG_RUNTIME_DIR (tinyproxy has no ~ or env
# expansion of its own).
#
# UNVERIFIED: written from tinyproxy.conf(5), not run. If it will not
# start: confirm `tinyproxy -v` reports filtering support, and that the
# rendered whitelist path exists.

# Loopback only. The bridge (phi-agent-net-bridge.service) connects here
# from a unix socket; nothing else can.
Listen 127.0.0.1
Port 8888

Timeout 600
MaxClients 20
StartServers 2

# Client ACL: only the local bridge. tinyproxy default-denies unlisted
# clients.
Allow 127.0.0.1

# Destination ACL: default-deny; the whitelist file is the entire allowlist.
# Every host A2 may reach is one line there and nowhere else. It grows by
# explicit addition, never for convenience (§5.1).
FilterDefaultDeny Yes
Filter "__HOME__/.config/phi-agent/tinyproxy/whitelist"
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off

DisableViaHeader Yes
LogLevel Warning
PidFile "__RUNTIME__/phi-agent/tinyproxy.pid"
